{% extends "forum_app/index.html" %}

{% block central-content %}
    <h1 class="category-header">Add a Post to {{ category.name }}</h1>
    
    <form id="post_form" method="post" action="{% url 'forum_app:add_post' category.slug %}" enctype="multipart/form-data">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <input type="submit" name="submit" value="Create Post" style="margin-top: 15px; padding: 10px 20px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer;" />
    </form>
{% endblock %}
