{% extends "forum_app/index.html" %}
{% load static %}

{% block headblock %}
    <title>Edit Profile - Forums</title>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/category.css' %}">
    <link rel="stylesheet" href="{% static 'css/edit_profile.css' %}">
{% endblock %}

{% block central-content %}
<div class="edit-container">
    <div class="edit-header">
        <h2>Edit Profile</h2>
    </div>

    <form method="post" action="{% url 'forum_app:edit_profile' user.username %}" class="edit-form">
        {% csrf_token %}

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ user.email }}">
        </div>

        <div class="form-group">
            <label>New Password</label>
            <input type="password" name="password" placeholder="Leave blank to remain unchanged">
        </div>

        <div class="form-actions">
            <button type="submit" class="submit-btn">Save Changes</button>
            <a href="{% url 'forum_app:profile' user.username %}" class="cancel-btn">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
