{% extends "forum_app/base.html" %}
{% load static %}

{% block headblock %}
<link rel="stylesheet" href="{% static 'css/edit_profile.css' %}">
{% endblock %}


{% block content %}


<div class="profile-container">
    <div class="profile-header">
        <h2>Edit Profile</h2>
    </div>

    <form method="post" class="edit-form">
        {% csrf_token %}
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ request.user.email }}">
        </div>

        <div class="form-group">
            <label> New Password </label>
            <input type="password" name="password" placeholder="Leave blank to remain unchanged">
        </div>

        <div class="form-actions">

        <button type="submit" class="submit-btn">Save Changes</button>
            <a href="{% url 'forum_app:profile' request.user.username %}">
            <button type="button" class="cancel-btn">Cancel</button>
            </a>
        </div>
    </form>
</div>

{% endblock %}''
